<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">Josiel Silva</title>
  <desc id="d">Desenvolvedor Front-End · Full Stack em formação. Primeira vaga conquistada, Belém, PA. React, Next.js e TypeScript.</desc>
  <style>
    .m { font-family: 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .in { opacity: 0; animation: in .5s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
    .d4 { animation-delay: 1.4s; } .d5 { animation-delay: 1.7s; } .d6 { animation-delay: 1.9s; } .d7 { animation-delay: 2.1s; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; } .cur { animation: none; } }
  </style>

  <!-- janela -->
  <rect x="0.5" y="0.5" width="879" height="299" rx="12" fill="#010409" stroke="#30363D"/>
  <path d="M12.5 .5 H867.5 A12 12 0 0 1 879.5 12.5 V40 H.5 V12.5 A12 12 0 0 1 12.5 .5 Z" fill="#161B22"/>
  <line x1="0.5" y1="40.5" x2="879.5" y2="40.5" stroke="#21262D"/>
  <circle cx="24" cy="20.5" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="20.5" r="6" fill="#FEBC2E"/>
  <circle cx="64" cy="20.5" r="6" fill="#28C840"/>
  <text class="m" x="440" y="25" text-anchor="middle" font-size="12" fill="#8B949E">josiel@belem: ~</text>

  <!-- whoami -->
  <text class="m in d1" x="36" y="84" font-size="14" fill="#8B949E"><tspan fill="#A855F7">❯</tspan> whoami</text>
  <text class="m in d2" x="34" y="150" font-size="60" font-weight="800" letter-spacing="-2" fill="#F0F6FC">Josiel Silva<tspan class="cur" fill="#A855F7">_</tspan></text>
  <text class="m in d3" x="36" y="186" font-size="16" fill="#C9D1D9">Desenvolvedor Front-End · Full Stack em formação</text>

  <!-- status -->
  <text class="m in d4" x="36" y="228" font-size="14" fill="#8B949E"><tspan fill="#A855F7">❯</tspan> cat status.txt</text>
  <g class="in d5">
    <rect x="36.5" y="244.5" width="244" height="30" rx="15" fill="none" stroke="#3FB950"/>
    <text class="m" x="158.5" y="264" text-anchor="middle" font-size="13" fill="#3FB950">● primeira vaga conquistada</text>
  </g>
  <g class="in d6">
    <rect x="292.5" y="244.5" width="104" height="30" rx="15" fill="none" stroke="#30363D"/>
    <text class="m" x="344.5" y="264" text-anchor="middle" font-size="13" fill="#C9D1D9">Belém, PA</text>
  </g>
  <g class="in d7">
    <rect x="408.5" y="244.5" width="256" height="30" rx="15" fill="none" stroke="#30363D"/>
    <text class="m" x="536.5" y="264" text-anchor="middle" font-size="13" fill="#C9D1D9">React · Next.js · TypeScript</text>
  </g>
</svg>
