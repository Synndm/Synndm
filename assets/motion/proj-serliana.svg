<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img" aria-label="Restaurante Serliana: interface com estética renascentista. HTML, CSS, JavaScript.">
  <defs>
    <clipPath id="c"><rect width="430" height="250" rx="16"/></clipPath>
    <radialGradient id="glow" cx=".5" cy=".2" r=".7"><stop offset="0" stop-color="#D4A373" stop-opacity=".3"/><stop offset="1" stop-color="#D4A373" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#8C6A43"/><stop offset=".5" stop-color="#F5D9A8"/><stop offset="1" stop-color="#8C6A43"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 400 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .serif { font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; }
    .draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2.2s ease-out forwards; }
    .a2 { animation-delay: .3s; } .a3 { animation-delay: .6s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .candle { transform-origin: center bottom; animation: flick 1.6s ease-in-out infinite alternate; }
    @keyframes flick { to { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } .candle { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="430" height="250" fill="#120D08"/>
    <rect width="430" height="250" fill="url(#glow)"/>

    <g fill="none" stroke="url(#gold)" stroke-width="2">
      <path class="draw a1" d="M95 124V70a35 35 0 0 1 70 0v54"/>
      <path class="draw a2" d="M180 124V56a35 35 0 0 1 70 0v68"/>
      <path class="draw a3" d="M265 124V70a35 35 0 0 1 70 0v54"/>
      <line x1="80" y1="124.5" x2="350" y2="124.5"/>
    </g>
    <ellipse class="candle" cx="215" cy="90" rx="4" ry="9" fill="#FBBF24"/>
    <rect x="212" y="98" width="6" height="18" rx="1" fill="#F5D9A8" fill-opacity=".7"/>
    <text class="serif" x="215" y="40" text-anchor="middle" font-size="15" font-style="italic" fill="#F5D9A8" letter-spacing="3">Serliana</text>

    <text class="mono" x="28" y="158" font-size="11" fill="#D4A373" letter-spacing="1">02 · INTERFACE</text>
    <text class="sans" x="28" y="186" font-size="22" font-weight="700" fill="#F4F4F5">Restaurante Serliana</text>
    <text class="sans" x="28" y="210" font-size="13" fill="#A1A1AA">Estética renascentista, responsiva e imersiva.</text>
    <text class="mono" x="28" y="232" font-size="11" fill="#71717A">html · css · javascript</text>
  </g>
  <rect x=".5" y=".5" width="429" height="249" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/>
  <circle cx="398" cy="158" r="14" fill="#FFFFFF" fill-opacity=".06"/>
  <path d="M393 163l10-10M396 153h7v7" fill="none" stroke="#E4E4E7" stroke-width="1.6" stroke-linecap="round"/>
</svg>
