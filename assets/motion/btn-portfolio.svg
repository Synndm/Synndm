<svg xmlns="http://www.w3.org/2000/svg" width="200" height="56" viewBox="0 0 200 56" role="img" aria-label="Portfólio">
  <defs>
    <clipPath id="c"><rect x="2" y="2" width="196" height="52" rx="26"/></clipPath>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#C026D3"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .s { animation: sweep 3.5s ease-in-out .4s infinite; transform: translateX(-120px); }
    @keyframes sweep { 0%, 60% { transform: translateX(-120px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0; } }
  </style>
  <rect x="2" y="2" width="196" height="52" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#c)"><rect class="s" x="0" y="0" width="80" height="56" fill="url(#shine)"/></g>
  <g fill="none" stroke="#fff" stroke-width="1.6">
    <circle cx="62" cy="28" r="9"/>
    <ellipse cx="62" cy="28" rx="4" ry="9"/>
    <line x1="53" y1="28" x2="71" y2="28"/>
  </g>
  <text x="80" y="34" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="600" fill="#fff">Portfólio</text>
</svg>
