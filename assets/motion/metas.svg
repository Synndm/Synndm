<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Metas 2026, 3 de 5 concluídas: projeto full stack no ar, portfólio publicado, primeira vaga como dev. Faltam: concluir Full Stack Java e lançar um SaaS próprio.">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .arc { stroke-dasharray: 339.3; stroke-dashoffset: 339.3; animation: fill 1.6s cubic-bezier(.2,.7,.2,1) .3s forwards; }
    @keyframes fill { to { stroke-dashoffset: 135.7; } }
    .row { opacity: 0; animation: in .5s ease-out forwards; }
    .i1 { animation-delay: .5s; } .i2 { animation-delay: .7s; } .i3 { animation-delay: .9s; } .i4 { animation-delay: 1.1s; } .i5 { animation-delay: 1.3s; }
    @keyframes in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    .next { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { stroke-opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .arc { animation: none; stroke-dashoffset: 135.7; } .row { animation: none; opacity: 1; } .next { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="879" height="189" rx="16" fill="#0D0B16" stroke="#FFFFFF" stroke-opacity=".1"/>

  <circle cx="112" cy="95" r="54" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="10"/>
  <circle class="arc" cx="112" cy="95" r="54" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 112 95)"/>
  <text class="sans" x="112" y="100" text-anchor="middle" font-size="26" font-weight="800" fill="#F4F4F5">3/5</text>
  <text class="mono" x="112" y="120" text-anchor="middle" font-size="10" fill="#A1A1AA" letter-spacing="1.5">2026</text>

  <g class="sans" font-size="15">
    <g class="row i1"><circle cx="232" cy="40" r="9" fill="#A855F7"/><path d="M227.5 40l3 3 5.5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="45" fill="#A1A1AA">Colocar um projeto full stack no ar</text></g>
    <g class="row i2"><circle cx="232" cy="68" r="9" fill="#A855F7"/><path d="M227.5 68l3 3 5.5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="73" fill="#A1A1AA">Publicar meu portfólio online</text></g>
    <g class="row i3"><circle cx="232" cy="96" r="9" fill="#A855F7"/><path d="M227.5 96l3 3 5.5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="101" fill="#A1A1AA">Conquistar a primeira vaga como dev</text></g>
    <g class="row i4"><circle class="next" cx="232" cy="124" r="8.5" fill="none" stroke="#C084FC" stroke-width="1.6"/><text x="252" y="129" fill="#F4F4F5" font-weight="600">Concluir o curso Full Stack Java</text><text class="mono" x="520" y="129" font-size="11" fill="#C084FC">em andamento</text></g>
    <g class="row i5"><circle cx="232" cy="152" r="8.5" fill="none" stroke="#52525B" stroke-width="1.6"/><text x="252" y="157" fill="#F4F4F5">Lançar um projeto SaaS próprio</text></g>
  </g>
</svg>
