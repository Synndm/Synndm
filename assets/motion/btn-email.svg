<svg xmlns="http://www.w3.org/2000/svg" width="200" height="56" viewBox="0 0 200 56" role="img" aria-label="E-mail">
  <defs>
    <clipPath id="c"><rect x="2" y="2" width="196" height="52" rx="26"/></clipPath>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .s { animation: sweep 3.5s ease-in-out .8s infinite; transform: translateX(-120px); }
    @keyframes sweep { 0%, 60% { transform: translateX(-120px) skewX(-20deg); } 100% { transform: translateX(260px) skewX(-20deg); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0; } }
  </style>
  <rect x="2.5" y="2.5" width="195" height="51" rx="25.5" fill="#0D0B16" stroke="#C084FC" stroke-opacity=".6"/>
  <g clip-path="url(#c)"><rect class="s" x="0" y="0" width="80" height="56" fill="url(#shine)"/></g>
  <g fill="none" stroke="#E9D5FF" stroke-width="1.6" stroke-linejoin="round">
    <rect x="56" y="20" width="20" height="15" rx="2.5"/>
    <path d="M57 22l9 7 9-7"/>
  </g>
  <text x="86" y="34" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F4F5">E-mail</text>
</svg>
