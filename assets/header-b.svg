<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
  <title id="t">Josiel Silva</title>
  <desc id="d">Desenvolvedor front-end em Belém, PA. Agora: primeira vaga como dev. Estudando Full Stack Java na EBAC. Graduação em Gestão de TI, 2027.</desc>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'Geist Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .fg { fill: #1F2328; } .muted { fill: #59636E; } .accent { fill: #8B3DD6; } .rule { stroke: #D1D9E0; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #F0F6FC; } .muted { fill: #8B949E; } .accent { fill: #C084FC; } .rule { stroke: #30363D; }
    }
    .in { opacity: 0; animation: in .8s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .8s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; } }
  </style>

  <!-- linha de cima -->
  <text class="mono muted" x="0" y="16" font-size="12" letter-spacing="1.5">PORTFÓLIO · 2026</text>
  <text class="mono muted" x="880" y="16" font-size="12" letter-spacing="1.5" text-anchor="end">BELÉM, PA — BRASIL</text>
  <line class="rule" x1="0" y1="34.5" x2="880" y2="34.5"/>

  <!-- nome -->
  <text class="serif fg in d1" x="-4" y="150" font-size="124" letter-spacing="-3">Josiel</text>
  <text class="serif accent in d2" x="-4" y="262" font-size="124" font-style="italic" letter-spacing="-3">Silva.</text>

  <!-- coluna esquerda -->
  <g class="in d3">
    <text class="sans fg" x="0" y="318" font-size="19">Desenvolvedor front-end que gosta de</text>
    <text class="sans fg" x="0" y="346" font-size="19">entender o problema antes de escrever</text>
    <text class="sans fg" x="0" y="374" font-size="19">a primeira linha de código.</text>

    <!-- coluna direita -->
    <text class="sans muted" x="472" y="314" font-size="14">Agora</text>
    <text class="sans fg" x="880" y="314" font-size="14" text-anchor="end">Primeira vaga como dev</text>
    <line class="rule" x1="472" y1="328.5" x2="880" y2="328.5"/>
    <text class="sans muted" x="472" y="352" font-size="14">Estudando</text>
    <text class="sans fg" x="880" y="352" font-size="14" text-anchor="end">Full Stack Java · EBAC</text>
    <line class="rule" x1="472" y1="366.5" x2="880" y2="366.5"/>
    <text class="sans muted" x="472" y="390" font-size="14">Graduação</text>
    <text class="sans fg" x="880" y="390" font-size="14" text-anchor="end">Gestão de TI · Uniasselvi · 2027</text>
    <line class="rule" x1="472" y1="404.5" x2="880" y2="404.5"/>
  </g>
</svg>
